<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludópatas FC - Gestión de Ciclos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto+Mono:wght@300&display=swap');
        :root { --bg: #0a0a0a; --panel: #161616; --gold: #d4af37; --red: #ff4d4d; --green: #2ecc71; --blue: #3498db; --text: #ffffff; --border: #333; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; }
        header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 20px; }
        header h1 { color: var(--gold); font-family: 'Playfair Display', serif; text-transform: uppercase; letter-spacing: 3px; margin: 0; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        h2 { font-size: 0.9rem; color: var(--gold); text-transform: uppercase; border-left: 3px solid var(--gold); padding-left: 10px; margin-top: 0; }
        select, input { width: 100%; padding: 12px; background: #222; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 10px; font-size: 1rem; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-green { background: var(--green); color: #fff; margin-top: 10px; }
        .btn-blue { background: var(--blue); color: #fff; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; color: var(--neutral); padding: 8px; border-bottom: 1px solid var(--border); }
        td { padding: 10px 5px; border-bottom: 1px solid #222; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
        .win { background: rgba(46, 204, 113, 0.2); color: var(--green); }
        .loss { background: rgba(255, 77, 77, 0.2); color: var(--red); }
        .month-header { background: #222; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; border: 1px solid var(--border); }
        .month-content { display: none; padding: 10px; }
        .show { display: block !important; }
        .cobro-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; font-weight: bold; }
        .loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:1000; color: var(--gold); }
    </style>
</head>
<body>

<div id="loader" class="loading">SINCRONIZANDO CON LOGS...</div>

<div class="container">
    <header>
        <h1>Ludópatas FC</h1>
        <div style="font-size: 0.7rem; color: var(--gold); letter-spacing: 2px;">GESTIÓN PROFESIONAL DE MESA</div>
    </header>

    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input type="text" id="current-date" style="text-align:center; background:transparent;" readonly>
        <input type="text" id="session-note" style="text-align:center; background:transparent;">
    </div>

    <div class="card">
        <h2>Panel de Socios</h2>
        <select id="select-socios"><option>Cargando lista...</option></select>
        <input type="number" id="buys" value="1" placeholder="MANOS">
        <button class="btn btn-gold" onclick="addJugador()">Sentar Socio</button>
    </div>

    <div class="card">
        <h2>Mesa en Vivo - Pozo: <span id="total-in">$0</span></h2>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>Jugador</th><th>Manos</th><th>Resultado</th><th>Estado</th><th></th></tr></thead>
                <tbody id="lista-mesa"></tbody>
            </table>
        </div>
        <button class="btn btn-green" onclick="validarMesa()">Finalizar Partida</button>
        <div id="resumen-final" style="display:none; margin-top:15px; border-top:1px solid var(--blue); padding-top:10px;">
            <div id="lista-resumen" style="font-size:0.9rem; line-height:1.8;"></div>
            <button class="btn btn-blue" onclick="enviarDatos()">Confirmar y Subir a Nube</button>
        </div>
    </div>

    <div class="card" style="border-color: var(--green);">
        <h2>Cobros y Pagos (Corte el 21)</h2>
        <select id="filtro-ciclo" onchange="renderCobros()"></select>
        <div id="cont-cobros"></div>
    </div>

    <h2>Historial por Ciclo</h2>
    <div id="historial"></div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbwlGgyfpFnmhcdznjm36Y4WKosP4VleZvt380X6Rx_CFs4Tf75VLvVmxrObm5bBFxqX/exec";
    let mesa = [], db = [];

    async function init() {
        const n = new Date();
        document.getElementById('current-date').value = n.toLocaleDateString('es-CL');
        document.getElementById('session-note').value = n.getHours() >= 18 ? "JORNADA NOCTURNA" : "JORNADA TARDE";
        await cargar();
    }

    async function cargar() {
        document.getElementById('loader').style.display = "flex";
        try {
            const r = await fetch(URL);
            const data = await r.json();
            db = data.historial;
            document.getElementById('select-socios').innerHTML = data.socios.map(s => `<option value="${s}">${s}</option>`).join('');
            renderCiclos();
            renderHistorial();
        } catch(e) { alert("Error de conexión"); }
        document.getElementById('loader').style.display = "none";
    }

    function addJugador() {
        const nom = document.getElementById('select-socios').value;
        if (!nom || mesa.find(j => j.nombre === nom)) return;
        mesa.push({ nombre: nom, manos: parseInt(document.getElementById('buys').value), neto: 0 });
        pintarMesa();
    }

    function pintarMesa() {
        const t = document.getElementById('lista-mesa');
        let pozo = 0;
        t.innerHTML = mesa.map((j, i) => {
            pozo += (j.manos * 100);
            return `<tr>
                <td><b>${j.nombre}</b></td>
                <td>${j.manos}</td>
                <td><input type="number" value="${j.neto}" style="width:70px; margin:0;" oninput="mesa[${i}].neto=parseInt(this.value)||0; actualizarBadges()"></td>
                <td id="status-${i}"></td>
                <td><button onclick="mesa.splice(${i},1); pintarMesa()" style="background:none; border:none; color:var(--red);">×</button></td>
            </tr>`;
        }).join('');
        document.getElementById('total-in').innerText = "$" + pozo;
        actualizarBadges();
    }

    function actualizarBadges() {
        mesa.forEach((j, i) => {
            const el = document.getElementById(`status-${i}`);
            if (j.neto > 0) el.innerHTML = `<span class="badge win">+$${j.neto}</span>`;
            else if (j.neto < 0) el.innerHTML = `<span class="badge loss">-$${Math.abs(j.neto)}</span>`;
            else el.innerHTML = `<span class="badge" style="color:#555">$0</span>`;
        });
    }

    function validarMesa() {
        const suma = mesa.reduce((a, b) => a + b.neto, 0);
        if (suma !== 0) return alert("La mesa no cuadra. Diferencia: $" + suma);
        document.getElementById('resumen-final').style.display = "block";
        document.getElementById('lista-resumen').innerHTML = mesa.map(j => `${j.nombre}: ${j.neto >= 0 ? '+' : ''}$${j.neto}`).join('<br>');
    }

    async function enviarDatos() {
        document.getElementById('loader').style.display = "flex";
        const payload = {
            fecha: document.getElementById('current-date').value,
            hora: new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'}),
            jornada: document.getElementById('session-note').value,
            jugadores: mesa.map(j => ({ nombre: j.nombre, inversion: j.manos * 100, balanceNeto: j.neto }))
        };
        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        location.reload();
    }

    function renderCiclos() {
        const ciclos = [...new Set(db.map(x => x.ID_Mes))].reverse();
        document.getElementById('filtro-ciclo').innerHTML = ciclos.map(c => `<option value="${c}">${c}</option>`).join('');
        renderCobros();
    }

    function renderCobros() {
        const ciclo = document.getElementById('filtro-ciclo').value;
        const filtrado = db.filter(x => x.ID_Mes === ciclo);
        const saldos = {};
        filtrado.forEach(x => saldos[x.Jugador] = (saldos[x.Jugador] || 0) + parseFloat(x.Resultado));
        
        document.getElementById('cont-cobros').innerHTML = Object.entries(saldos)
            .sort((a,b) => b[1] - a[1])
            .map(([n, s]) => `<div class="cobro-row"><span>${n}</span><span style="color:${s>=0?'var(--green)':'var(--red)'}">${s>=0?'+':''}$${s}</span></div>`)
            .join('');
    }

    function renderHistorial() {
        const cont = document.getElementById('historial');
        const grupos = {};
        db.slice().reverse().forEach(x => {
            if (!grupos[x.ID_Mes]) grupos[x.ID_Mes] = [];
            grupos[x.ID_Mes].push(x);
        });
        cont.innerHTML = Object.keys(grupos).map(id => `
            <div class="month-header" onclick="this.nextElementSibling.classList.toggle('show')">
                <span>Ciclo ${id}</span><span>▼</span>
            </div>
            <div class="month-content">
                ${grupos[id].map(x => `<div style="font-size:0.75rem; padding:5px 0; border-bottom:1px solid #222; display:flex; justify-content:space-between;">
                    <span>${x.Fecha} - ${x.Jugador}</span>
                    <span style="color:${x.Resultado>=0?'var(--green)':'var(--red)'}">${x.Resultado>=0?'+':''}$${x.Resultado}</span>
                </div>`).join('')}
            </div>
        `).join('');
    }

    init();
</script>
</body>
</html>
