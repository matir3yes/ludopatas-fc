<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronización Black King</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --panel: #161616; --text: #eee; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .card { background: var(--panel); border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .error-msg { color: #ff4d4d; border: 1px solid #ff4d4d; padding: 10px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <header style="text-align:center; border-bottom: 2px solid var(--gold); padding-bottom:10px;">
        <h2 style="color:var(--gold);">BLACK KING AUTOMOTRIZ</h2>
    </header>

    <div id="error-box" class="error-msg"></div>

    <div class="card">
        <h3>Estado de Sincronización</h3>
        <p id="status">Conectando con Google Sheets...</p>
    </div>

    <div class="card">
        <h3>Historial Reciente</h3>
        <div id="historial-container">Cargando datos...</div>
    </div>

<script>
    // TU LINK ACTUALIZADO
    const API_URL = "https://script.google.com/macros/s/AKfycbzc3MvOrmfyz2NMxq-d-Y8BA8xD6QCgnTGMUMB4ZWdYO1aIVPvRbGhP2xvfMIUbVCzP/exec";

    async function cargarDatos() {
        const status = document.getElementById('status');
        const errorBox = document.getElementById('error-box');
        const container = document.getElementById('historial-container');

        try {
            const res = await fetch(API_URL);
            const data = await res.json();

            if (data.error) {
                throw new Error("Error en Script: " + data.error);
            }

            status.innerText = "✅ Sistema Conectado";
            
            // Renderizar Historial
            if (data.historial && data.historial.length > 0) {
                container.innerHTML = data.historial.slice(-5).map(h => `
                    <div style="border-bottom:1px solid #333; padding:5px; font-size:0.8rem;">
                        ${h.Fecha} | ${h.Jugador} | <b>$${h.Resultado}</b>
                    </div>
                `).join('');
            } else {
                container.innerHTML = "No hay datos en la pestaña LOG.";
            }

        } catch (e) {
            status.innerText = "❌ Error de Conexión";
            errorBox.style.display = "block";
            errorBox.innerText = "ERROR TÉCNICO: " + e.message + ". Verifica que las pestañas LOG y SOCIOS existan.";
            console.error(e);
        }
    }

    window.onload = cargarDatos;
</script>
</body>
</html>
