<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludópatas FC - Gestión Profesional</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --panel: #161616; --border: #333; --text: #eee; --red: #ff4d4d; --green: #2ecc71; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; }
        h1 { color: var(--gold); margin: 0; letter-spacing: 2px; font-size: 1.5rem; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        h2 { color: var(--gold); font-size: 0.9rem; text-transform: uppercase; margin-top: 0; border-left: 3px solid var(--gold); padding-left: 10px; }
        select, input { width: 100%; padding: 12px; background: #222; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 10px; box-sizing: border-box; font-size: 1rem; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-green { background: var(--green); color: #fff; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 0.7rem; color: var(--gold); padding: 8px; border-bottom: 1px solid var(--border); }
        td { padding: 10px 8px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .cobro-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .debe { color: var(--red); font-weight: bold; }
        .favor { color: var(--green); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LUDÓPATAS FC</h1>
        <div style="font-size: 0.6rem; color: #666;">GESTIÓN TÉCNICA - BLACK KING AUTOMOTRIZ</div>
    </header>

    <!-- REGISTRO DE JUGADORES -->
    <div class="card">
        <h2>Sentar en Mesa</h2>
        <select id="player-select"><option>Cargando socios...</option></select>
        <input type="number" id="buys" placeholder="Manos compradas ($100 c/u)" value="1">
        <button class="btn btn-gold" onclick="addPlayer()">Agregar a la Partida</button>
    </div>

    <!-- MESA EN VIVO -->
    <div class="card">
        <h2>Mesa en Vivo</h2>
        <table id="live-table">
            <thead><tr><th>JUGADOR</th><th>MANOS</th><th>RESULTADO</th><th>ACCIÓN</th></tr></thead>
            <tbody></tbody>
        </table>
        <button id="save-btn" class="btn btn-green" style="display:none;" onclick="liquidarYGuardar()">Finalizar y Guardar Jornada</button>
    </div>

    <!-- CONTROL DE COBROS MENSUALES -->
    <div class="card">
        <h2>Resumen de Cobros (Corte al 21)</h2>
        <select id="month-filter" onchange="renderCobros()"></select>
        <div id="cobros-list"></div>
    </div>
</div>

<script>
    // URL implementada correctamente
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysQ9fdRUXIj4bDGxvr2iVJP2ZZKl3bOT2R_A8tzq9dW28XKc6_JiervEYpsVsgrEmA/exec"; 
    
    let sociosData = [];
    let historialData = [];
    let mesaActual = [];

    async function init() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            sociosData = data.socios;
            historialData = data.historial;

            // Cargar select de socios desde la pestaña "SOCIOS"
            const select = document.getElementById('player-select');
            select.innerHTML = sociosData.map(s => `<option value="${s}">${s}</option>`).join('');

            // Cargar periodos disponibles según la columna ID_Mes
            const periodos = [...new Set(historialData.map(h => h.ID_Mes))].reverse();
            const monthFilter = document.getElementById('month-filter');
            monthFilter.innerHTML = periodos.map(p => `<option value="${p}">${p}</option>`).join('');

            renderCobros();
        } catch (error) {
            console.error("Error al cargar datos:", error);
        }
    }

    function addPlayer() {
        const nombre = document.getElementById('player-select').value;
        const manos = parseInt(document.getElementById('buys').value);
        if(mesaActual.find(j => j.nombre === nombre)) return alert("El jugador ya está en la mesa.");

        mesaActual.push({ nombre, manos, balanceNeto: 0 });
        renderMesa();
    }

    function renderMesa() {
        const tbody = document.querySelector('#live-table tbody');
        tbody.innerHTML = mesaActual.map((j, i) => `
            <tr>
                <td>${j.nombre}</td>
                <td>${j.manos}</td>
                <td><input type="number" onchange="updateBalance(${i}, this.value)" style="width:70px; margin:0; padding:5px; background:#333; color:#fff; border:1px solid #555;"></td>
                <td><button onclick="mesaActual.splice(${i},1); renderMesa();" style="background:none; border:none; color:#ff4d4d; cursor:pointer;">✖</button></td>
            </tr>
        `).join('');
        document.getElementById('save-btn').style.display = mesaActual.length > 0 ? 'block' : 'none';
    }

    function updateBalance(index, val) { 
        mesaActual[index].balanceNeto = parseFloat(val) || 0; 
    }

    function renderCobros() {
        const periodo = document.getElementById('month-filter').value;
        const listDiv = document.getElementById('cobros-list');
        let saldos = {};
        
        sociosData.forEach(s => saldos[s] = 0);

        historialData.filter(h => h.ID_Mes === periodo).forEach(reg => {
            if(saldos[reg.Jugador] !== undefined) {
                saldos[reg.Jugador] += parseFloat(reg.Resultado);
            }
        });

        listDiv.innerHTML = Object.entries(saldos).map(([name, total]) => `
            <div class="cobro-row">
                <span>${name}</span>
                <span class="${total < 0 ? 'debe' : (total > 0 ? 'favor' : '')}">
                    ${total === 0 ? 'AL DÍA' : (total < 0 ? 'DEBE $' + Math.abs(total) : 'A FAVOR $' + total)}
                </span>
            </div>
        `).join('');
    }

    async function liquidarYGuardar() {
        if(!confirm("¿Deseas cerrar la jornada y sincronizar con Google Sheets?")) return;
        
        const payload = {
            fecha: new Date().toLocaleDateString('es-CL'),
            hour: new Date().toLocaleTimeString('es-CL', {hour: '2-digit', minute:'2-digit'}),
            jornada: "PARTIDA " + new Date().toLocaleDateString(),
            jugadores: mesaActual
        };

        try {
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify(payload) 
            });
            alert("Jornada guardada con éxito.");
            location.reload();
        } catch (error) {
            alert("Error al guardar: " + error);
        }
    }

    window.onload = init;
</script>
</body>
</html>
