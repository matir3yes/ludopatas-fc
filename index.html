<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludópatas FC - Panel de Control</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --panel: #161616; --border: #333; --text: #eee; --red: #ff4d4d; --green: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 10px; margin: 0; }
        .container { max-width: 900px; margin: auto; }
        header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 15px; }
        h1 { color: var(--gold); letter-spacing: 2px; margin: 5px 0; font-size: 1.5rem; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 15px; overflow-x: auto; }
        h2 { color: var(--gold); font-size: 0.75rem; text-transform: uppercase; border-left: 3px solid var(--gold); padding-left: 10px; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; color: #888; padding: 8px; border-bottom: 1px solid var(--border); }
        td { padding: 8px; border-bottom: 1px solid #222; }
        
        .btn { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .btn-gold { background: var(--gold); color: #000; width: 100%; margin-bottom: 10px; }
        .btn-green { background: var(--green); color: #fff; width: 100%; }
        .btn-op { padding: 4px 8px; background: #333; color: white; border-radius: 4px; }
        
        input { background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; width: 60px; }
        select { width: 100%; padding: 10px; background: #222; color: white; border-radius: 8px; margin-bottom: 10px; }
        
        .status-win { color: var(--green); font-weight: bold; }
        .status-loss { color: var(--red); font-weight: bold; }
        .status-zero { color: #888; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LUDÓPATAS FC</h1>
        <div style="font-size:0.6rem; color:#666;">CONTROL DE MESA - BLACK KING AUTOMOTRIZ</div>
    </header>

    <!-- MESA EN VIVO -->
    <div class="card">
        <h2>Mesa en Vivo</h2>
        <select id="sel-socio"></select>
        <button class="btn btn-gold" onclick="sentarJugador()">Sentar en Mesa</button>
        
        <table>
            <thead>
                <tr>
                    <th>Jugador</th>
                    <th>Manos</th>
                    <th>Inversión</th>
                    <th>Cierre</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tabla-mesa"></tbody>
        </table>

        <div id="controles-finales" style="display:none; margin-top:15px; border-top:1px solid #444; padding-top:10px;">
            <div id="txt-cuadre" style="text-align:center; font-weight:bold; margin-bottom:10px; font-size:0.8rem;"></div>
            <button class="btn btn-green" onclick="enviarReporte()">Sincronizar y Cerrar</button>
        </div>
    </div>

    <!-- COBROS -->
    <div class="card" style="border-color: var(--green);">
        <h2>Cobros Mensuales (Corte 21)</h2>
        <select id="filtro-mes" onchange="actualizarVistas()"></select>
        <div id="lista-cobros"></div>
    </div>

    <!-- HISTORIAL -->
    <div class="card">
        <h2>Historial de Partidas</h2>
        <div id="historial-partidas"></div>
    </div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbzEDAW59LMsubsUHWaO7NCBp4Fp5tuogSmhHljTEBJjF9QElvPgXb6X9GrIbdraOnNI/exec";
    let db = { socios: [], historial: [] };
    let mesa = [];

    async function init() {
        const res = await fetch(URL);
        db = await res.json();
        document.getElementById('sel-socio').innerHTML = db.socios.map(s => `<option value="${s}">${s}</option>`).join('');
        const periodos = [...new Set(db.historial.map(h => h.ID_Mes))].reverse();
        document.getElementById('filtro-mes').innerHTML = periodos.map(p => `<option value="${p}">${p}</option>`).join('');
        actualizarVistas();
    }

    function sentarJugador() {
        const nombre = document.getElementById('sel-socio').value;
        if (mesa.find(j => j.nombre === nombre)) return;
        mesa.push({ nombre, manos: 1, inversion: 100, cierre: 0, balance: -100 });
        renderMesa();
    }

    function ajustarManos(idx, delta) {
        mesa[idx].manos = Math.max(1, mesa[idx].manos + delta);
        mesa[idx].inversion = mesa[idx].manos * 100;
        calcularFila(idx);
    }

    function calcularFila(idx) {
        const j = mesa[idx];
        j.balance = j.cierre - j.inversion;
        renderMesa();
    }

    function renderMesa() {
        const tbody = document.getElementById('tabla-mesa');
        tbody.innerHTML = mesa.map((j, i) => `
            <tr>
                <td style="font-weight:bold;">${j.nombre}</td>
                <td>
                    <button class="btn-op" onclick="ajustarManos(${i},-1)">-</button>
                    <span style="margin:0 5px;">${j.manos}</span>
                    <button class="btn-op" onclick="ajustarManos(${i},1)">+</button>
                </td>
                <td>$${j.inversion}</td>
                <td>
                    <input type="number" value="${j.cierre}" onchange="mesa[${i}].cierre=parseFloat(this.value)||0; calcularFila(${i})">
                </td>
                <td class="${j.balance > 0 ? 'status-win' : (j.balance < 0 ? 'status-loss' : 'status-zero')}">
                    ${j.balance > 0 ? '+' : ''}$${j.balance}
                </td>
                <td><button class="btn-op" onclick="mesa.splice(${i},1);renderMesa()">❌</button></td>
            </tr>
        `).join('');

        const totalInv = mesa.reduce((sum, j) => sum + j.inversion, 0);
        const totalCie = mesa.reduce((sum, j) => sum + j.cierre, 0);
        const diff = totalCie - totalInv;
        
        const txtCuadre = document.getElementById('txt-cuadre');
        txtCuadre.innerHTML = `Inversión: $${totalInv} | Cierre: $${totalCie} <br> 
                               <span style="color:${diff === 0 ? 'var(--green)' : 'var(--red)'}">
                               ${diff === 0 ? 'MESA CUADRADA ✅' : 'DIFERENCIA: $' + diff}</span>`;
        
        document.getElementById('controles-finales').style.display = mesa.length > 0 ? 'block' : 'none';
    }

    async function enviarReporte() {
        const totalInv = mesa.reduce((sum, j) => sum + j.inversion, 0);
        const totalCie = mesa.reduce((sum, j) => sum + j.cierre, 0);
        if (totalInv !== totalCie) {
            if (!confirm("La mesa no cuadra. ¿Deseas guardar de todas formas?")) return;
        }

        const payload = {
            fecha: new Date().toLocaleDateString('es-CL'),
            hora: new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'}),
            jornada: "PARTIDA " + new Date().toLocaleDateString(),
            jugadores: mesa.map(j => ({ nombre: j.nombre, inversion: j.inversion, balanceNeto: j.balance }))
        };

        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        alert("Datos sincronizados con éxito.");
        location.reload();
    }

    function actualizarVistas() {
        const periodo = document.getElementById('filtro-mes').value;
        const filtrado = db.historial.filter(h => h.ID_Mes === periodo);
        
        // Cobros
        let saldos = {};
        db.socios.forEach(s => saldos[s] = 0);
        filtrado.forEach(r => { if(saldos[r.Jugador] !== undefined) saldos[r.Jugador] += parseFloat(r.Resultado); });
        
        document.getElementById('lista-cobros').innerHTML = Object.entries(saldos).map(([n, t]) => `
            <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #222; font-size:0.85rem;">
                <span>${n}</span>
                <span class="${t > 0 ? 'status-win' : (t < 0 ? 'status-loss' : 'status-zero')}">${t > 0 ? '+' : ''}$${t}</span>
            </div>
        `).join('');

        // Historial
        let sesiones = {};
        filtrado.forEach(r => {
            const id = r.Fecha + r.Hora;
            if(!sesiones[id]) sesiones[id] = { f: r.Fecha, h: r.Hora, p: [] };
            sesiones[id].p.push(r);
        });

        document.getElementById('historial-partidas').innerHTML = Object.values(sesiones).reverse().map(s => `
            <div style="background:#111; border:1px solid #222; border-radius:8px; margin-bottom:10px; overflow:hidden;">
                <div style="background:#1a1a1a; padding:5px 10px; font-size:0.7rem; color:var(--gold); display:flex; justify-content:space-between;">
                    <span>📅 ${s.f}</span> <span>⏰ ${s.h}</span>
                </div>
                ${s.p.map(j => `
                    <div style="display:flex; justify-content:space-between; padding:5px 10px; font-size:0.8rem;">
                        <span>${j.Jugador}</span>
                        <span class="${j.Resultado > 0 ? 'status-win' : (j.Resultado < 0 ? 'status-loss' : 'status-zero')}">${j.Resultado > 0 ? '+' : ''}$${j.Resultado}</span>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    window.onload = init;
</script>
</body>
</html>
