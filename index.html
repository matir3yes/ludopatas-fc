<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludópatas FC - Black King</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --panel: #161616; --border: #333; --text: #eee; --red: #ff4d4d; --green: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; }
        h1 { color: var(--gold); letter-spacing: 2px; margin: 5px 0; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        h2 { color: var(--gold); font-size: 0.8rem; text-transform: uppercase; border-left: 3px solid var(--gold); padding-left: 10px; margin-bottom: 15px; }
        
        /* Formulario */
        select, input { width: 100%; padding: 12px; background: #222; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-green { background: var(--green); color: #fff; }

        /* Estilo Historial "Como antes" */
        .session-card { background: #111; border-radius: 8px; margin-bottom: 12px; border: 1px solid #222; overflow: hidden; }
        .session-header { background: #1a1a1a; padding: 8px 12px; font-size: 0.7rem; display: flex; justify-content: space-between; color: var(--gold); border-bottom: 1px solid #222; }
        .player-row { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #1a1a1a; font-size: 0.85rem; }
        .monto { font-weight: bold; }

        /* Resumen de Cobros */
        .cobro-item { display: flex; justify-content: space-between; padding: 10px; background: #1a1a1a; margin-bottom: 5px; border-radius: 6px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LUDÓPATAS FC</h1>
        <div style="font-size:0.6rem; color:#666;">SISTEMA PROFESIONAL - BLACK KING AUTOMOTRIZ</div>
    </header>

    <!-- 1. MESA DE JUEGO -->
    <div class="card">
        <h2>Nueva Jornada</h2>
        <select id="sel-socio"></select>
        <input type="number" id="in-manos" placeholder="Manos ($100 c/u)" value="1">
        <button class="btn btn-gold" onclick="agregarAMesa()">Sentar Jugador</button>
        <div id="mesa-viva" style="margin-top:15px;"></div>
        <button id="btn-guardar" class="btn btn-green" style="display:none; margin-top:10px;" onclick="enviarDatos()">Guardar Partida</button>
    </div>

    <!-- 2. RESUMEN DE COBROS (CALCULAR) -->
    <div class="card" style="border-color: var(--green);">
        <h2>Control de Cobros (Corte al 21)</h2>
        <select id="filtro-mes" onchange="actualizarVistas()"></select>
        <div id="lista-cobros"></div>
    </div>

    <!-- 3. HISTORIAL DETALLADO (LAS PARTIDAS) -->
    <div class="card">
        <h2>Historial de Partidas</h2>
        <div id="historial-detallado"></div>
    </div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbysQ9fdRUXIj4bDGxvr2iVJP2ZZKl3bOT2R_A8tzq9dW28XKc6_JiervEYpsVsgrEmA/exec";
    let db = { socios: [], historial: [] };
    let mesa = [];

    async function cargar() {
        const res = await fetch(URL);
        db = await res.json();
        
        document.getElementById('sel-socio').innerHTML = db.socios.map(s => `<option value="${s}">${s}</option>`).join('');
        
        const periodos = [...new Set(db.historial.map(h => h.ID_Mes))].reverse();
        document.getElementById('filtro-mes').innerHTML = periodos.map(p => `<option value="${p}">${p}</option>`).join('');
        
        actualizarVistas();
    }

    function actualizarVistas() {
        const periodo = document.getElementById('filtro-mes').value;
        const filtrado = db.historial.filter(h => h.ID_Mes === periodo);
        
        // Render Cobros
        let saldos = {};
        db.socios.forEach(s => saldos[s] = 0);
        filtrado.forEach(r => { if(saldos[r.Jugador] !== undefined) saldos[r.Jugador] += parseFloat(r.Resultado); });
        
        document.getElementById('lista-cobros').innerHTML = Object.entries(saldos).map(([nom, tot]) => `
            <div class="cobro-item">
                <span>${nom}</span>
                <span class="${tot < 0 ? 'monto' : 'monto'}" style="color:${tot < 0 ? 'var(--red)' : (tot > 0 ? 'var(--green)' : '#888')}">
                    ${tot < 0 ? '-$' + Math.abs(tot) : (tot > 0 ? '+$' + tot : '$0')}
                </span>
            </div>
        `).join('');

        // Render Historial (Agrupado por Sesión)
        let sesiones = {};
        filtrado.forEach(r => {
            const id = r.Fecha + r.Hora;
            if(!sesiones[id]) sesiones[id] = { fecha: r.Fecha, hora: r.Hora, jugadores: [] };
            sesiones[id].jugadores.push(r);
        });

        document.getElementById('historial-detallado').innerHTML = Object.values(sesiones).reverse().map(s => `
            <div class="session-card">
                <div class="session-header"><span>📅 ${s.fecha}</span> <span>⏰ ${s.hora}</span></div>
                ${s.jugadores.map(j => `
                    <div class="player-row">
                        <span>${j.Jugador}</span>
                        <span style="color:${j.Resultado < 0 ? 'var(--red)' : 'var(--green)'}">${j.Resultado < 0 ? '-$' + Math.abs(j.Resultado) : '+$' + j.Resultado}</span>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    function agregarAMesa() {
        const n = document.getElementById('sel-socio').value;
        const m = parseInt(document.getElementById('in-manos').value);
        if(mesa.find(x => x.nombre === n)) return;
        mesa.push({ nombre: n, manos: m, balanceNeto: 0 });
        dibujarMesa();
    }

    function dibujarMesa() {
        document.getElementById('mesa-viva').innerHTML = mesa.map((j, i) => `
            <div class="player-row" style="background:#222; margin-bottom:5px; border-radius:5px;">
                <span>${j.nombre} (${j.manos})</span>
                <input type="number" onchange="mesa[${i}].balanceNeto=parseFloat(this.value)||0" style="width:80px; margin:0; padding:5px;">
            </div>
        `).join('');
        document.getElementById('btn-guardar').style.display = mesa.length > 0 ? 'block' : 'none';
    }

    async function enviarDatos() {
        if(!confirm("¿Guardar sesión?")) return;
        const payload = {
            fecha: new Date().toLocaleDateString('es-CL'),
            hora: new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'}),
            jornada: "PARTIDA " + new Date().toLocaleDateString(),
            jugadores: mesa
        };
        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        alert("Sincronizado con Black King Automotriz");
        location.reload();
    }

    window.onload = cargar;
</script>
</body>
</html>
